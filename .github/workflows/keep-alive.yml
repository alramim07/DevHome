name: Keep Alive
on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render (keeps web service awake)
        run: |
          curl -fsS -o /dev/null -w "%{http_code}" https://devhome.onrender.com
          echo " ← Render status"

      - name: Ping Supabase Storage (keeps project active)
        run: |
          curl -fsS -o /dev/null -w "%{http_code}" "https://otlmreopycsxtqswjoyg.supabase.co/storage/v1/object/public/devhome/web-settings/qwBHCAe6wqQXHGYiIzsDVPN8o2RUlohTb1Cs03MV.webp"
          echo " ← Supabase status"